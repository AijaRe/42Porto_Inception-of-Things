<svg xmlns="http://www.w3.org/2000/svg" width="680" height="228" viewBox="0 0 680 228" role="img">
<title>p1: how the worker joins the server</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="228" rx="12" fill="#1E1E1D"/>
<g style="font-family:Arial,Helvetica,'Liberation Sans',sans-serif">
<rect x="240" y="30" width="200" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="1"/>
<text x="340.0" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#F1EFE8">vagrant up</text>
<path d="M300 74 L300 92 L155 92 L155 116" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
<path d="M380 74 L380 92 L525 92 L525 116" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
<rect x="40" y="120" width="230" height="80" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="1"/>
<text x="155.0" y="141.0" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#E1F5EE">gamado-xS (server)</text>
<text x="155.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#5DCAA5">swap + K3s server</text>
<text x="155.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#5DCAA5">writes node token</text>
<rect x="410" y="120" width="230" height="80" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="1"/>
<text x="525.0" y="141.0" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#E1F5EE">gamado-xSW (agent)</text>
<text x="525.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#5DCAA5">swap, waits for token</text>
<text x="525.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#5DCAA5">K3s agent</text>
<text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B4B2A9">token in /vagrant</text>
<path d="M272 146 L406 146" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
<path d="M408 178 L274 178" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B4B2A9">joins on :6443</text>
</g>
</svg>
