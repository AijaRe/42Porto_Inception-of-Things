<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" role="img">
<title>p2: Traefik routes by Host header to three apps</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="322" rx="12" fill="#1E1E1D"/>
<g style="font-family:Arial,Helvetica,'Liberation Sans',sans-serif">
<rect x="30" y="120" width="140" height="56" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="1"/>
<text x="100.0" y="138.5" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#E1F5EE">Traefik</text>
<text x="100.0" y="157.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#5DCAA5">reads the Host</text>
<path d="M170 148 L185 148 L185 68 L196 68" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
