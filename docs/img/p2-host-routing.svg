<text x="270.0" y="77.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#AFA9EC">Host rule</text>
<path d="M340 68 L366 68" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
<rect x="370" y="40" width="110" height="56" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="1"/>
<text x="425.0" y="58.5" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#EEEDFE">app1-svc</text>
<text x="425.0" y="77.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#AFA9EC">ClusterIP :80</text>
