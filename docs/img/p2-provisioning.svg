<svg xmlns="http://www.w3.org/2000/svg" width="680" height="312" viewBox="0 0 680 312" role="img">
<title>p2: what each provisioner puts in the cluster</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="312" rx="12" fill="#1E1E1D"/>
<g style="font-family:Arial,Helvetica,'Liberation Sans',sans-serif">
<rect x="240" y="30" width="200" height="44" rx="8" fill="#444441" stroke="#888780" stroke-width="1"/>
<text x="340.0" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#F1EFE8">vagrant up</text>
<path d="M340 74 L340 92 L180 92 L180 108" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
<rect x="60" y="112" width="240" height="56" rx="8" fill="#444441" stroke="#888780" stroke-width="1"/>
<text x="180.0" y="130.5" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#F1EFE8">ServerSetup</text>
<text x="180.0" y="149.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#B4B2A9">installs K3s server</text>
<path d="M300 140 L376 140" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
<rect x="380" y="112" width="240" height="56" rx="8" fill="#444441" stroke="#888780" stroke-width="1"/>
<text x="500.0" y="130.5" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#F1EFE8">DeployApps</text>
<text x="500.0" y="149.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#B4B2A9">kubectl apply the YAML</text>
<path d="M180 168 L180 196" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
<path d="M500 168 L500 196" fill="none" stroke="#B4B2A9" stroke-width="1.2"  marker-end="url(#a)"/>
<rect x="60" y="200" width="240" height="56" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="1"/>
<text x="180.0" y="218.5" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#E1F5EE">Traefik + servicelb</text>
<text x="180.0" y="237.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#5DCAA5">K3s deploys them itself</text>
<rect x="380" y="200" width="240" height="56" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="1"/>
<text x="500.0" y="218.5" text-anchor="middle" dominant-baseline="central" font-size="14.5" font-weight="400" fill="#EEEDFE">Deployments, Services</text>
<text x="500.0" y="237.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#AFA9EC">and the Ingress</text>
<rect x="170" y="279" width="14" height="14" rx="3" fill="#085041" stroke="#1D9E75"/>
<text x="192" y="286" text-anchor="start" dominant-baseline="central" font-size="12" fill="#B4B2A9">Deployed by K3s</text>
<rect x="340" y="279" width="14" height="14" rx="3" fill="#3C3489" stroke="#7F77DD"/>
<text x="362" y="286" text-anchor="start" dominant-baseline="central" font-size="12" fill="#B4B2A9">Your p2 manifests</text>
</g>
</svg>
