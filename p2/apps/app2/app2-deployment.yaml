apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deploy
  labels:
    app: app2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2-container
          image: paulbouwer/hello-kubernetes:1.11.0
          ports:
            - containerPort: 8080
          env:
            - name: MESSAGE
              value: "Hello from app2"
